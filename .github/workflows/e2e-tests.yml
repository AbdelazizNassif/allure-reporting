name: Selenium Tests with Allure Report

on:
  workflow_dispatch:
    inputs:
      deploy_message:
        description: 'Deployment message'
        required: true
        default: 'Manual production deployment'

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Test' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create and populate .env file
        run: |
          echo "Creating .env file..."
          touch .env
          echo "APP_URL=${{ vars.APP_URL }}" >> .env
          echo "REGISTERED_EMAIL=${{ vars.REGISTERED_EMAIL }}" >> .env
          echo "VALID_PASSWORD=${{ vars.VALID_PASSWORD }}" >> .env
          
          echo "Verifying .env file content:"
          cat .env

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/$(curl -s https://api.github.com/repos/docker/compose/releases/latest | jq -r .tag_name)/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Run Docker Compose
        run: docker-compose up -d

      - name: Run Maven tests
        run: mvn clean test -Dtest="com.petfinder.tests.regressionE2eTests.*.**"

      - name: Set up Allure CLI
        uses: allure-framework/setup-allure@v1
        if: always()
        with:
          version: '3.0.0'

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh_pages
          publish_dir: ./allure-report
